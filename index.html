<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 · 项目展示</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <nav class="nav">
      <a href="#home" class="logo" id="navLogo">你的名字</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="#home">首页</a></li>
        <li><a href="#projects">项目</a></li>
        <li><a href="#contact">联系</a></li>
      </ul>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
    </nav>
  </header>

  <main>
    <!-- 首屏 Hero -->
    <section id="home" class="hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <div class="avatar-placeholder" id="heroAvatar">👤</div>
        <h1 id="heroName">你的名字</h1>
        <p class="tagline" id="heroTagline">一句话介绍你的身份和方向</p>
        <p class="hero-desc" id="heroDesc">在这里用两三句话描述你的经历、擅长的领域，以及你能为合作伙伴提供的价值。这段文字会出现在首屏最显眼的位置。</p>
        <div class="hero-cta">
          <a href="#projects" class="btn btn-primary">查看项目</a>
          <a href="#contact" class="btn btn-secondary">联系我</a>
        </div>
      </div>
    </section>

    <!-- 项目列表 -->
    <section id="projects" class="projects">
      <h2 class="section-title">项目列表</h2>
      <p class="section-subtitle">点击任意项目卡片查看详细介绍</p>

      <!-- 主推暴利热门项目 -->
      <div class="featured-block">
        <h3 class="featured-title">主推暴利热门项目</h3>
        <div id="featuredGrid" class="project-grid"></div>
      </div>

      <div id="projectGrid" class="project-grid">
        <!-- 由 app.js 动态渲染 -->
      </div>
    </section>

    <!-- 联系方式 -->
    <section id="contact" class="contact">
      <h2 class="section-title">联系我</h2>
      <p class="section-subtitle">通过以下方式找到我</p>
      <div class="contact-content" id="contactContent">
        <!-- 由 app.js 动态渲染 -->
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p id="footerText">© 2026 你的名字 · 保留所有权利</p>
  </footer>

  <!-- 项目详情弹窗 -->
  <div id="projectDetail" class="project-detail" aria-hidden="true">
    <div class="project-detail-content">
      <button class="close-detail" id="closeDetail" aria-label="关闭">×</button>
      <div id="projectDetailBody"></div>
    </div>
  </div>

  <!-- 返回顶部 -->
  <button id="backTop" class="back-top" aria-label="返回顶部">↑</button>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
